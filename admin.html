<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Afinco | Painel Administrativo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0f14;
      color: #f5f5f5;
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background:
        radial-gradient(circle at top, #18212d 0%, #0b0f14 55%);
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: #121821;
      border: 1px solid #26313e;
      border-radius: 22px;
      padding: 35px;
      box-shadow: 0 25px 70px rgba(0,0,0,.45);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-name {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand-name span {
      color: #d7b56d;
    }

    .brand-subtitle {
      color: #8994a3;
      margin-top: 8px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      color: #b7c0cc;
      font-size: 13px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 11px;
      border: 1px solid #303b49;
      background: #0d131b;
      color: white;
      outline: none;
    }

    .input-group input:focus {
      border-color: #d7b56d;
    }

    .primary-btn {
      width: 100%;
      border: none;
      border-radius: 11px;
      padding: 14px;
      background: #d7b56d;
      color: #111;
      font-weight: 800;
      transition: .2s;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .error-message {
      display: none;
      background: #32161a;
      border: 1px solid #6f272f;
      color: #ffb4bb;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 13px;
    }

    /* =========================
       ADMIN
    ========================= */

    #adminScreen {
      display: none;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11,15,20,.94);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid #202a35;
    }

    .topbar-inner {
      max-width: 1450px;
      margin: auto;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .topbar-logo {
      font-size: 25px;
      font-weight: 800;
    }

    .topbar-logo span {
      color: #d7b56d;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-email {
      color: #8994a3;
      font-size: 12px;
    }

    .logout-btn {
      border: 1px solid #394552;
      background: #151c25;
      color: #e8edf2;
      padding: 9px 14px;
      border-radius: 9px;
      font-size: 12px;
    }

    .logout-btn:hover {
      background: #202a35;
    }

    .container {
      max-width: 1450px;
      margin: auto;
      padding: 35px 25px 60px;
    }

    .welcome {
      margin-bottom: 28px;
    }

    .welcome h1 {
      font-size: 31px;
      margin-bottom: 7px;
    }

    .welcome p {
      color: #8994a3;
      font-size: 14px;
    }

    /* =========================
       STATS
    ========================= */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #121821;
      border: 1px solid #222d39;
      border-radius: 16px;
      padding: 20px;
      min-height: 105px;
    }

    .stat-label {
      color: #8994a3;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 29px;
      font-weight: 800;
    }

    .stat-card.total {
      border-color: #3a4654;
    }

    /* =========================
       FILTERS
    ========================= */

    .filters {
      background: #121821;
      border: 1px solid #222d39;
      border-radius: 17px;
      padding: 18px;
      margin-bottom: 24px;
    }

    .filters-title {
      font-size: 13px;
      color: #8994a3;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .filters-row {
      display: grid;
      grid-template-columns: 1fr 220px auto auto;
      gap: 10px;
    }

    .search-wrapper {
      position: relative;
    }

    .search-wrapper input,
    .filters select {
      width: 100%;
      height: 46px;
      border: 1px solid #303b49;
      border-radius: 10px;
      background: #0d131b;
      color: white;
      outline: none;
      padding: 0 14px;
    }

    .search-wrapper input:focus,
    .filters select:focus {
      border-color: #d7b56d;
    }

    .action-btn {
      height: 46px;
      padding: 0 18px;
      border-radius: 10px;
      border: 1px solid #303b49;
      background: #18212c;
      color: white;
      font-weight: 700;
    }

    .action-btn:hover {
      background: #222d39;
    }

    .clear-btn {
      background: transparent;
    }

    /* =========================
       RESULTS
    ========================= */

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 15px;
    }

    .results-title {
      font-size: 18px;
      font-weight: 800;
    }

    .results-count {
      color: #8994a3;
      font-size: 13px;
    }

    .candidates-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .candidate-card {
      background: #121821;
      border: 1px solid #222d39;
      border-radius: 18px;
      padding: 22px;
      transition: .2s;
    }

    .candidate-card:hover {
      border-color: #394552;
      transform: translateY(-1px);
    }

    .candidate-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .candidate-name {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .candidate-date {
      color: #778291;
      font-size: 11px;
    }

    .status-select {
      min-width: 135px;
      border-radius: 9px;
      padding: 9px 10px;
      background: #0d131b;
      color: white;
      border: 1px solid #303b49;
      outline: none;
      font-weight: 700;
      font-size: 12px;
    }

    .status-select:focus {
      border-color: #d7b56d;
    }

    .candidate-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .info-item {
      background: #0d131b;
      border: 1px solid #1e2833;
      border-radius: 11px;
      padding: 12px;
    }

    .info-label {
      color: #6f7b89;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 5px;
    }

    .info-value {
      color: #e7ebef;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }

    .info-full {
      grid-column: 1 / -1;
    }

    .status-novo {
      border-color: #48627c;
    }

    .status-analise {
      border-color: #7b6840;
    }

    .status-entrevista {
      border-color: #5d4b7c;
    }

    .status-aprovado {
      border-color: #406c50;
    }

    .status-reprovado {
      border-color: #703d43;
    }

    /* =========================
       EMPTY / LOADING
    ========================= */

    .message-box {
      background: #121821;
      border: 1px solid #222d39;
      border-radius: 17px;
      padding: 45px 20px;
      text-align: center;
      color: #8994a3;
      grid-column: 1 / -1;
    }

    .loading {
      font-size: 14px;
    }

    /* =========================
       TOAST
    ========================= */

    #toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 999;
      min-width: 260px;
      max-width: 380px;
      padding: 14px 17px;
      border-radius: 12px;
      background: #17231c;
      border: 1px solid #385c44;
      color: #d7f3df;
      box-shadow: 0 15px 40px rgba(0,0,0,.4);
      display: none;
      font-size: 13px;
      font-weight: 600;
    }

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 1150px) {
      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .candidates-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 750px) {
      .topbar-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .topbar-right {
        width: 100%;
        justify-content: space-between;
      }

      .container {
        padding: 25px 15px 45px;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .filters-row {
        grid-template-columns: 1fr;
      }

      .candidate-header {
        flex-direction: column;
      }

      .status-select {
        width: 100%;
      }

      .candidate-info {
        grid-template-columns: 1fr;
      }

      .info-full {
        grid-column: auto;
      }
    }

    @media (max-width: 430px) {
      .login-box {
        padding: 25px 20px;
      }

      .stats-grid {
        gap: 9px;
      }

      .stat-card {
        padding: 15px;
      }

      .stat-number {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================== -->

  <section id="loginScreen">

    <div class="login-box">

      <div class="brand">
        <div class="brand-name">
          Afinco<span>.</span>
        </div>

        <div class="brand-subtitle">
          Painel Administrativo
        </div>
      </div>

      <div id="loginError" class="error-message"></div>

      <form id="loginForm">

        <div class="input-group">
          <label for="email">E-mail</label>

          <input
            type="email"
            id="email"
            placeholder="Digite seu e-mail"
            required
            autocomplete="username"
          >
        </div>

        <div class="input-group">
          <label for="password">Senha</label>

          <input
            type="password"
            id="password"
            placeholder="Digite sua senha"
            required
            autocomplete="current-password"
          >
        </div>

        <button
          type="submit"
          class="primary-btn"
          id="loginButton"
        >
          Entrar no painel
        </button>

      </form>

    </div>

  </section>


  <!-- =========================
       ADMIN
  ========================== -->

  <section id="adminScreen">

    <header class="topbar">

      <div class="topbar-inner">

        <div class="topbar-logo">
          Afinco<span>.</span>
        </div>

        <div class="topbar-right">

          <div
            class="admin-email"
            id="adminEmail"
          ></div>

          <button
            class="logout-btn"
            id="logoutButton"
          >
            Sair
          </button>

        </div>

      </div>

    </header>


    <main class="container">

      <div class="welcome">

        <h1>Painel de Candidaturas</h1>

        <p>
          Acompanhe os candidatos e gerencie cada etapa do processo seletivo.
        </p>

      </div>


      <!-- ESTATÍSTICAS -->

      <section class="stats-grid">

        <div class="stat-card total">
          <div class="stat-label">Total</div>
          <div class="stat-number" id="totalCount">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Novos</div>
          <div class="stat-number" id="novoCount">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Em análise</div>
          <div class="stat-number" id="analiseCount">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Entrevista</div>
          <div class="stat-number" id="entrevistaCount">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Aprovados</div>
          <div class="stat-number" id="aprovadoCount">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Reprovados</div>
          <div class="stat-number" id="reprovadoCount">0</div>
        </div>

      </section>


      <!-- FILTROS -->

      <section class="filters">

        <div class="filters-title">
          Buscar e filtrar candidatos
        </div>

        <div class="filters-row">

          <div class="search-wrapper">

            <input
              type="text"
              id="searchInput"
              placeholder="🔎  Pesquisar pelo nome do candidato..."
              autocomplete="off"
            >

          </div>

          <select id="statusFilter">

            <option value="Todos">Todos os status</option>
            <option value="Novo">Novo</option>
            <option value="Em análise">Em análise</option>
            <option value="Entrevista">Entrevista</option>
            <option value="Aprovado">Aprovado</option>
            <option value="Reprovado">Reprovado</option>

          </select>

          <button
            class="action-btn"
            id="refreshButton"
          >
            ↻ Atualizar
          </button>

          <button
            class="action-btn clear-btn"
            id="clearButton"
          >
            Limpar
          </button>

        </div>

      </section>


      <!-- RESULTADOS -->

      <section>

        <div class="results-header">

          <div class="results-title">
            Candidaturas
          </div>

          <div
            class="results-count"
            id="resultsCount"
          >
            0 candidatos
          </div>

        </div>

        <div
          class="candidates-grid"
          id="candidatesList"
        >

          <div class="message-box loading">
            Carregando candidaturas...
          </div>

        </div>

      </section>

    </main>

  </section>


  <div id="toast"></div>


  <script>

    /* =====================================================
       CONFIGURAÇÃO SUPABASE
    ===================================================== */

    const SUPABASE_URL =
      "https://suxumbvzokoezwxouyeg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_1N3VgWZFmYC6UKTYdW_xYw_dwsa91AZ";


    /* =====================================================
       ELEMENTOS
    ===================================================== */

    const loginScreen =
      document.getElementById("loginScreen");

    const adminScreen =
      document.getElementById("adminScreen");

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const loginError =
      document.getElementById("loginError");

    const adminEmail =
      document.getElementById("adminEmail");

    const logoutButton =
      document.getElementById("logoutButton");

    const candidatesList =
      document.getElementById("candidatesList");

    const searchInput =
      document.getElementById("searchInput");

    const statusFilter =
      document.getElementById("statusFilter");

    const refreshButton =
      document.getElementById("refreshButton");

    const clearButton =
      document.getElementById("clearButton");


    /* =====================================================
       ESTADO
    ===================================================== */

    let candidates = [];

    let filteredCandidates = [];

    let accessToken =
      localStorage.getItem("afinco_access_token") || "";

    let refreshToken =
      localStorage.getItem("afinco_refresh_token") || "";


    /* =====================================================
       UTILITÁRIOS
    ===================================================== */

    function escapeHTML(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function formatDate(dateValue) {

      if (!dateValue) {
        return "-";
      }

      const date = new Date(dateValue);

      if (Number.isNaN(date.getTime())) {
        return dateValue;
      }

      return date.toLocaleString("pt-BR", {
        dateStyle: "short",
        timeStyle: "short"
      });
    }


    function showToast(message) {

      const toast =
        document.getElementById("toast");

      toast.textContent = message;
      toast.style.display = "block";

      clearTimeout(window.toastTimer);

      window.toastTimer =
        setTimeout(() => {
          toast.style.display = "none";
        }, 3000);
    }


    function showLoginError(message) {

      loginError.textContent = message;
      loginError.style.display = "block";
    }


    function hideLoginError() {

      loginError.style.display = "none";
      loginError.textContent = "";
    }


    function getStatusClass(status) {

      switch (status) {

        case "Novo":
          return "status-novo";

        case "Em análise":
          return "status-analise";

        case "Entrevista":
          return "status-entrevista";

        case "Aprovado":
          return "status-aprovado";

        case "Reprovado":
          return "status-reprovado";

        default:
          return "";
      }
    }


    /* =====================================================
       LOGIN
    ===================================================== */

    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      hideLoginError();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      loginButton.disabled = true;
      loginButton.textContent = "Entrando...";

      try {

        const response = await fetch(
          `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email,
              password
            })
          }
        );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error_description ||
            data.msg ||
            data.message ||
            "E-mail ou senha incorretos."
          );
        }

        accessToken =
          data.access_token;

        refreshToken =
          data.refresh_token;

        localStorage.setItem(
          "afinco_access_token",
          accessToken
        );

        localStorage.setItem(
          "afinco_refresh_token",
          refreshToken
        );

        adminEmail.textContent =
          email;

        loginScreen.style.display =
          "none";

        adminScreen.style.display =
          "block";

        await loadCandidates();

      } catch (error) {

        console.error(error);

        showLoginError(
          error.message ||
          "Não foi possível entrar."
        );

      } finally {

        loginButton.disabled = false;
        loginButton.textContent =
          "Entrar no painel";
      }

    });


    /* =====================================================
       CARREGAR CANDIDATURAS
    ===================================================== */

    async function loadCandidates() {

      candidatesList.innerHTML = `
        <div class="message-box loading">
          Carregando candidaturas...
        </div>
      `;

      try {

        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/candidaturas?select=*&order=created_at.desc`,
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${accessToken}`
            }
          }
        );

        if (response.status === 401) {

          logout();

          throw new Error(
            "Sua sessão expirou. Entre novamente."
          );
        }

        if (!response.ok) {

          const errorData =
            await response.text();

          throw new Error(
            errorData ||
            "Erro ao carregar candidaturas."
          );
        }

        candidates =
          await response.json();

        updateStats();

        applyFilters();

      } catch (error) {

        console.error(error);

        candidatesList.innerHTML = `
          <div class="message-box">
            Não foi possível carregar as candidaturas.
            <br><br>
            <button
              class="action-btn"
              onclick="loadCandidates()"
            >
              Tentar novamente
            </button>
          </div>
        `;

      }

    }


    /* =====================================================
       ESTATÍSTICAS
    ===================================================== */

    function updateStats() {

      document.getElementById("totalCount")
        .textContent = candidates.length;

      document.getElementById("novoCount")
        .textContent =
          candidates.filter(c => c.status === "Novo").length;

      document.getElementById("analiseCount")
        .textContent =
          candidates.filter(c => c.status === "Em análise").length;

      document.getElementById("entrevistaCount")
        .textContent =
          candidates.filter(c => c.status === "Entrevista").length;

      document.getElementById("aprovadoCount")
        .textContent =
          candidates.filter(c => c.status === "Aprovado").length;

      document.getElementById("reprovadoCount")
        .textContent =
          candidates.filter(c => c.status === "Reprovado").length;
    }


    /* =====================================================
       FILTROS
    ===================================================== */

    function applyFilters() {

      const search =
        searchInput.value
          .trim()
          .toLowerCase();

      const status =
        statusFilter.value;

      filteredCandidates =
        candidates.filter(candidate => {

          const name =
            (candidate.nome_completo || "")
              .toLowerCase();

          const matchesName =
            !search ||
            name.includes(search);

          const matchesStatus =
            status === "Todos" ||
            candidate.status === status;

          return matchesName &&
                 matchesStatus;
        });

      renderCandidates();
    }


    searchInput.addEventListener(
      "input",
      applyFilters
    );


    statusFilter.addEventListener(
      "change",
      applyFilters
    );


    clearButton.addEventListener(
      "click",
      function() {

        searchInput.value = "";
        statusFilter.value = "Todos";

        applyFilters();
      }
    );


    refreshButton.addEventListener(
      "click",
      async function() {

        refreshButton.disabled = true;
        refreshButton.textContent =
          "Atualizando...";

        await loadCandidates();

        refreshButton.disabled = false;
        refreshButton.textContent =
          "↻ Atualizar";

        showToast(
          "Candidaturas atualizadas."
        );
      }
    );


    /* =====================================================
       RENDERIZAR CANDIDATURAS
    ===================================================== */

    function renderCandidates() {

      document.getElementById("resultsCount")
        .textContent =
          `${filteredCandidates.length} ${
            filteredCandidates.length === 1
              ? "candidato"
              : "candidatos"
          }`;

      if (filteredCandidates.length === 0) {

        candidatesList.innerHTML = `
          <div class="message-box">
            Nenhuma candidatura encontrada.
          </div>
        `;

        return;
      }

      candidatesList.innerHTML =
        filteredCandidates
          .map(candidate => {

            const status =
              candidate.status || "Novo";

            return `

              <article class="candidate-card">

                <div class="candidate-header">

                  <div>

                    <div class="candidate-name">
                      ${escapeHTML(candidate.nome_completo)}
                    </div>

                    <div class="candidate-date">
                      Candidatura recebida em
                      ${formatDate(candidate.created_at)}
                    </div>

                  </div>

                  <select
                    class="status-select ${getStatusClass(status)}"
                    onchange="updateStatus('${escapeHTML(candidate.id)}', this.value)"
                  >

                    <option
                      value="Novo"
                      ${status === "Novo" ? "selected" : ""}
                    >
                      Novo
                    </option>

                    <option
                      value="Em análise"
                      ${status === "Em análise" ? "selected" : ""}
                    >
                      Em análise
                    </option>

                    <option
                      value="Entrevista"
                      ${status === "Entrevista" ? "selected" : ""}
                    >
                      Entrevista
                    </option>

                    <option
                      value="Aprovado"
                      ${status === "Aprovado" ? "selected" : ""}
                    >
                      Aprovado
                    </option>

                    <option
                      value="Reprovado"
                      ${status === "Reprovado" ? "selected" : ""}
                    >
                      Reprovado
                    </option>

                  </select>

                </div>


                <div class="candidate-info">

                  <div class="info-item">

                    <div class="info-label">
                      Idade
                    </div>

                    <div class="info-value">
                      ${escapeHTML(candidate.idade)}
                    </div>

                  </div>


                  <div class="info-item">

                    <div class="info-label">
                      Sexo
                    </div>

                    <div class="info-value">
                      ${escapeHTML(candidate.sexo)}
                    </div>

                  </div>


                  <div class="info-item">

                    <div class="info-label">
                      Trabalhando atualmente
                    </div>

                    <div class="info-value">
                      ${escapeHTML(candidate.trabalhando_atualmente)}
                    </div>

                  </div>


                  <div class="info-item">

                    <div class="info-label">
                      Como soube da vaga
                    </div>

                    <div class="info-value">
                      ${escapeHTML(candidate.como_soube)}
                    </div>

                  </div>


                  <div class="info-item">

                    <div class="info-label">
                      Início
                    </div>

                    <div class="info-value">
                      ${escapeHTML(candidate.inicio)}
                    </div>

                  </div>


                  <div class="info-item">

                    <div class="info-label">
                      Experiência em vendas
                    </div>

                    <div class="info-value">
                      ${escapeHTML(candidate.experiencia_vendas)}
                    </div>

                  </div>


                  <div class="info-item info-full">

                    <div class="info-label">
                      Experiência profissional
                    </div>

                    <div class="info-value">
                      ${escapeHTML(candidate.experiencia) || "-"}
                    </div>

                  </div>


                  <div class="info-item info-full">

                    <div class="info-label">
                      Motivo / Por que quer trabalhar conosco
                    </div>

                    <div class="info-value">
                      ${escapeHTML(candidate.motivo) || "-"}
                    </div>

                  </div>

                </div>

              </article>

            `;

          })
          .join("");
    }


    /* =====================================================
       ALTERAR STATUS
    ===================================================== */

    async function updateStatus(id, newStatus) {

      const candidate =
        candidates.find(
          item => item.id === id
        );

      if (!candidate) {
        return;
      }

      const oldStatus =
        candidate.status;

      candidate.status =
        newStatus;

      updateStats();
      applyFilters();

      try {

        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/candidaturas?id=eq.${encodeURIComponent(id)}`,
          {
            method: "PATCH",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${accessToken}`,
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            },

            body: JSON.stringify({
              status: newStatus
            })
          }
        );

        if (!response.ok) {

          candidate.status =
            oldStatus;

          updateStats();
          applyFilters();

          const errorText =
            await response.text();

          throw new Error(
            errorText ||
            "Não foi possível salvar o status."
          );
        }

        showToast(
          `Status alterado para "${newStatus}".`
        );

      } catch (error) {

        console.error(error);

        showToast(
          "Erro ao salvar o status."
        );
      }

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    logoutButton.addEventListener(
      "click",
      logout
    );


    function logout() {

      accessToken = "";
      refreshToken = "";

      localStorage.removeItem(
        "afinco_access_token"
      );

      localStorage.removeItem(
        "afinco_refresh_token"
      );

      adminScreen.style.display =
        "none";

      loginScreen.style.display =
        "flex";

      loginForm.reset();

      candidates = [];
      filteredCandidates = [];
    }


    /* =====================================================
       VERIFICAR SESSÃO AO ABRIR
    ===================================================== */

    async function initialize() {

      if (!accessToken) {
        return;
      }

      try {

        const response = await fetch(
          `${SUPABASE_URL}/auth/v1/user`,
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${accessToken}`
            }
          }
        );

        if (!response.ok) {

          logout();
          return;
        }

        const user =
          await response.json();

        adminEmail.textContent =
          user.email || "";

        loginScreen.style.display =
          "none";

        adminScreen.style.display =
          "block";

        await loadCandidates();

      } catch (error) {

        console.error(error);
        logout();
      }

    }


    initialize();

  </script>
