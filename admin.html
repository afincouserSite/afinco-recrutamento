<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Administrativo | Afinco</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #ffffff;
      min-height: 100vh;
    }

    :root {
      --gold: #f5c542;
      --gold-light: #ffd966;
      --black: #050505;
      --dark: #0c0c0c;
      --card: #111111;
      --white: #ffffff;
      --muted: #b8b8b8;
      --red: #ff5555;
      --green: #62d98b;
    }

    .container {
      width: min(1200px, 94%);
      margin: 0 auto;
    }

    header {
      background: rgba(5, 5, 5, 0.96);
      border-bottom: 1px solid rgba(245, 197, 66, 0.25);
      padding: 20px 0;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo-area h1 {
      color: var(--gold);
      font-size: 24px;
      text-transform: uppercase;
    }

    .logo-area p {
      color: #999;
      font-size: 13px;
      margin-top: 4px;
    }

    .logout-button {
      background: transparent;
      border: 1px solid rgba(245, 197, 66, 0.5);
      color: var(--gold);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-button:hover {
      background: rgba(245, 197, 66, 0.1);
    }

    .login-box {
      max-width: 450px;
      margin: 80px auto;
      background: var(--card);
      border: 1px solid rgba(245, 197, 66, 0.3);
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.4);
    }

    .login-box h2 {
      color: var(--gold);
      margin-bottom: 10px;
    }

    .login-box p {
      color: var(--muted);
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      color: #eee;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .field input,
    .filter,
    .status-select {
      width: 100%;
      background: #050505;
      border: 1px solid #303030;
      color: white;
      border-radius: 8px;
      padding: 13px;
      outline: none;
    }

    .field input:focus,
    .filter:focus,
    .status-select:focus {
      border-color: var(--gold);
    }

    .primary-button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 15px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #111;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
    }

    .primary-button:hover {
      filter: brightness(1.05);
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .error {
      color: var(--red);
    }

    .success {
      color: var(--green);
    }

    #adminPanel {
      display: none;
      padding: 40px 0 70px;
    }

    .dashboard-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .dashboard-top h2 {
      font-size: 32px;
      text-transform: uppercase;
    }

    .dashboard-top span {
      color: var(--gold);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 220px auto;
      gap: 12px;
      margin-bottom: 25px;
    }

    .search {
      background: #111;
      border: 1px solid #303030;
      color: white;
      border-radius: 8px;
      padding: 13px;
      outline: none;
    }

    .search:focus {
      border-color: var(--gold);
    }

    .reload-button {
      border: 1px solid rgba(245, 197, 66, 0.5);
      background: transparent;
      color: var(--gold);
      border-radius: 8px;
      padding: 13px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .reload-button:hover {
      background: rgba(245, 197, 66, 0.1);
    }

    .candidates {
      display: grid;
      gap: 18px;
    }

    .candidate {
      background: var(--card);
      border: 1px solid rgba(245, 197, 66, 0.22);
      border-radius: 15px;
      padding: 22px;
    }

    .candidate-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 18px;
    }

    .candidate-name {
      font-size: 22px;
      font-weight: 900;
    }

    .candidate-date {
      color: #888;
      font-size: 12px;
      margin-top: 5px;
    }

    .status-area {
      min-width: 190px;
    }

    .status-label {
      display: block;
      color: #999;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .candidate-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .info {
      background: #090909;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #202020;
    }

    .info.full {
      grid-column: 1 / -1;
    }

    .info strong {
      display: block;
      color: var(--gold);
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .info span {
      color: #ddd;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      background: #111;
      border: 1px solid #222;
      border-radius: 15px;
      color: #888;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--gold);
    }

    @media (max-width: 800px) {

      .header-content,
      .dashboard-top,
      .candidate-header {
        flex-direction: column;
        align-items: stretch;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .candidate-info {
        grid-template-columns: 1fr;
      }

      .info.full {
        grid-column: auto;
      }

      .status-area {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container header-content">

      <div class="logo-area">
        <h1>AFINCO</h1>
        <p>Painel Administrativo — Recrutamento</p>
      </div>

      <button
        id="logoutButton"
        class="logout-button"
        onclick="sair()"
        style="display:none;"
      >
        SAIR
      </button>

    </div>
  </header>


  <main class="container">

    <!-- LOGIN -->

    <section id="loginBox" class="login-box">

      <h2>Acesso administrativo</h2>

      <p>
        Entre com o usuário administrativo criado no Supabase.
      </p>

      <div class="field">

        <label for="email">
          E-mail
        </label>

        <input
          id="email"
          type="email"
          placeholder="Seu e-mail"
          autocomplete="username"
        >

      </div>


      <div class="field">

        <label for="senha">
          Senha
        </label>

        <input
          id="senha"
          type="password"
          placeholder="Sua senha"
          autocomplete="current-password"
        >

      </div>


      <button
        id="loginButton"
        class="primary-button"
        onclick="entrar()"
      >
        Entrar
      </button>

      <div
        id="loginMessage"
        class="message"
      ></div>

    </section>


    <!-- PAINEL -->

    <section id="adminPanel">

      <div class="dashboard-top">

        <div>

          <h2>
            Candidaturas <span>●</span>
          </h2>

          <p style="color:#888; margin-top:5px;">
            Gerencie os candidatos do processo seletivo.
          </p>

        </div>

      </div>


      <div class="controls">

        <input
          id="searchInput"
          class="search"
          type="text"
          placeholder="Pesquisar por nome..."
          oninput="filtrarCandidaturas()"
        >


        <select
          id="statusFilter"
          class="filter"
          onchange="filtrarCandidaturas()"
        >

          <option value="Todos">
            Todos os status
          </option>

          <option value="Novo">
            Novo
          </option>

          <option value="Em análise">
            Em análise
          </option>

          <option value="Entrevista">
            Entrevista
          </option>

          <option value="Aprovado">
            Aprovado
          </option>

          <option value="Reprovado">
            Reprovado
          </option>

        </select>


        <button
          class="reload-button"
          onclick="carregarCandidaturas()"
        >
          ↻ Atualizar
        </button>

      </div>


      <div
        id="candidates"
        class="candidates"
      ></div>

    </section>

  </main>


  <script>

    const SUPABASE_URL =
      "https://suxumbvzokoezwxouyeg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_1N3VgWZFmYC6UKTYdW_xYw_dwsa91AZ";


    let candidaturas = [];


    async function entrar() {

      const email =
        document.getElementById("email").value.trim();

      const senha =
        document.getElementById("senha").value;

      const mensagem =
        document.getElementById("loginMessage");

      const botao =
        document.getElementById("loginButton");


      mensagem.textContent = "";
      mensagem.className = "message";

      if (!email || !senha) {

        mensagem.textContent =
          "Preencha o e-mail e a senha.";

        mensagem.classList.add("error");

        return;
      }


      botao.disabled = true;
      botao.textContent = "ENTRANDO...";


      try {

        const resposta = await fetch(
          SUPABASE_URL + "/auth/v1/token?grant_type=password",
          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email: email,
              password: senha
            })
          }
        );


        const dados = await resposta.json();


        if (!resposta.ok) {

          console.error("Erro de login:", dados);

          throw new Error(
            dados.error_description ||
            dados.msg ||
            "E-mail ou senha incorretos."
          );
        }


        localStorage.setItem(
          "afinco_access_token",
          dados.access_token
        );


        localStorage.setItem(
          "afinco_refresh_token",
          dados.refresh_token
        );


        document.getElementById("loginBox").style.display =
          "none";

        document.getElementById("adminPanel").style.display =
          "block";

        document.getElementById("logoutButton").style.display =
          "block";


        await carregarCandidaturas();


      } catch (erro) {

        mensagem.textContent =
          erro.message;

        mensagem.classList.add("error");

      } finally {

        botao.disabled = false;
        botao.textContent = "ENTRAR";

      }

    }


    async function carregarCandidaturas() {

      const container =
        document.getElementById("candidates");

      const token =
        localStorage.getItem("afinco_access_token");


      if (!token) {

        sair();

        return;
      }


      container.innerHTML =
        '<div class="loading">Carregando candidaturas...</div>';


      try {

        const resposta = await fetch(
          SUPABASE_URL +
          "/rest/v1/candidaturas?select=*&order=created_at.desc",
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + token,
              "Content-Type": "application/json"
            }
          }
        );


        const dados = await resposta.json();


        if (!resposta.ok) {

          console.error("Erro ao carregar candidaturas:", dados);

          throw new Error(
            "Não foi possível carregar as candidaturas."
          );
        }


        candidaturas = dados;

        filtrarCandidaturas();


      } catch (erro) {

        console.error(erro);

        container.innerHTML = `
          <div class="empty">
            <strong>Não foi possível carregar as candidaturas.</strong>
            <br><br>
            ${erro.message}
          </div>
        `;

      }

    }


    function filtrarCandidaturas() {

      const busca =
        document.getElementById("searchInput").value
        .toLowerCase()
        .trim();

      const status =
        document.getElementById("statusFilter").value;


      const resultado =
        candidaturas.filter(function(candidato) {

          const nome =
            (candidato.nome_completo || "")
            .toLowerCase();

          const correspondeNome =
            nome.includes(busca);

          const correspondeStatus =
            status === "Todos" ||
            candidato.status === status;

          return correspondeNome && correspondeStatus;

        });


      renderizarCandidaturas(resultado);

    }


    function renderizarCandidaturas(lista) {

      const container =
        document.getElementById("candidates");


      if (!lista.length) {

        container.innerHTML = `
          <div class="empty">
            Nenhuma candidatura encontrada.
          </div>
        `;

        return;
      }


      container.innerHTML =
        lista.map(function(candidato) {

          return `

            <article class="candidate">

              <div class="candidate-header">

                <div>

                  <div class="candidate-name">
                    ${escapar(candidato.nome_completo)}
                  </div>

                  <div class="candidate-date">
                    Recebida em ${formatarData(candidato.created_at)}
                  </div>

                </div>


                <div class="status-area">

                  <span class="status-label">
                    Status
                  </span>

                  <select
                    class="status-select"
                    onchange="alterarStatus('${candidato.id}', this.value)"
                  >

                    ${opcaoStatus("Novo", candidato.status)}
                    ${opcaoStatus("Em análise", candidato.status)}
                    ${opcaoStatus("Entrevista", candidato.status)}
                    ${opcaoStatus("Aprovado", candidato.status)}
                    ${opcaoStatus("Reprovado", candidato.status)}

                  </select>

                </div>

              </div>


              <div class="candidate-info">

                <div class="info">

                  <strong>Idade</strong>

                  <span>
                    ${escapar(candidato.idade)}
                  </span>

                </div>


                <div class="info">

                  <strong>Sexo</strong>

                  <span>
                    ${escapar(candidato.sexo)}
                  </span>

                </div>


                <div class="info">

                  <strong>Trabalhando atualmente</strong>

                  <span>
                    ${escapar(candidato.trabalhando_atualmente)}
                  </span>

                </div>


                <div class="info">

                  <strong>Como soube</strong>

                  <span>
                    ${escapar(candidato.como_soube)}
                  </span>

                </div>


                <div class="info">

                  <strong>Início</strong>

                  <span>
                    ${escapar(candidato.inicio)}
                  </span>

                </div>


                <div class="info">

                  <strong>Experiência em vendas</strong>

                  <span>
                    ${escapar(candidato.experiencia_vendas)}
                  </span>

                </div>


                <div class="info full">

                  <strong>Experiência profissional</strong>

                  <span>
                    ${escapar(candidato.experiencia || "Não informado")}
                  </span>

                </div>


                <div class="info full">

                  <strong>Por que deveria participar?</strong>

                  <span>
                    ${escapar(candidato.motivo || "Não informado")}
                  </span>

                </div>

              </div>

            </article>

          `;

        }).join("");

    }


    function opcaoStatus(valor, atual) {

      return `
        <option
          value="${valor}"
          ${valor === atual ? "selected" : ""}
        >
          ${valor}
        </option>
      `;

    }


    async function alterarStatus(id, novoStatus) {

      const token =
        localStorage.getItem("afinco_access_token");


      if (!token) {

        sair();

        return;
      }


      try {

        const resposta = await fetch(
          SUPABASE_URL +
          "/rest/v1/candidaturas?id=eq." +
          encodeURIComponent(id),
          {
            method: "PATCH",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + token,
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            },

            body: JSON.stringify({
              status: novoStatus
            })
          }
        );


        if (!resposta.ok) {

          const erro =
            await resposta.text();

          console.error(
            "Erro ao alterar status:",
            erro
          );

          throw new Error(
            "Não foi possível alterar o status."
          );
        }


        const candidato =
          candidaturas.find(function(item) {
            return item.id === id;
          });


        if (candidato) {
          candidato.status = novoStatus;
        }


        filtrarCandidaturas();


      } catch (erro) {

        alert(erro.message);

        await carregarCandidaturas();

      }

    }


    function formatarData(data) {

      if (!data) {
        return "Data não informada";
      }


      return new Date(data).toLocaleString(
        "pt-BR",
        {
          dateStyle: "short",
          timeStyle: "short"
        }
      );

    }


    function escapar(valor) {

      if (valor === null || valor === undefined) {
        return "";
      }


      return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function sair() {

      localStorage.removeItem(
        "afinco_access_token"
      );

      localStorage.removeItem(
        "afinco_refresh_token"
      );


      document.getElementById("adminPanel").style.display =
        "none";

      document.getElementById("logoutButton").style.display =
        "none";

      document.getElementById("loginBox").style.display =
        "block";

      document.getElementById("email").value = "";
      document.getElementById("senha").value = "";

    }


    document.getElementById("senha")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          entrar();
        }

      });

  </script>

</body>
</html>
